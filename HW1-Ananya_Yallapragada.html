<!DOCTYPE html>
<html>

<body>

    <h1>Community sports league fixtures</h1>
    <form>
        <label for="fixtureName">Fixture Name:</label><br>
        <input type="text" id="fixtureName" name="fixtureName" value=""><br>
        <label for="team1">Team 1:</label><br>
        <input type="text" id="team1" name="team1" value=""><br>
        <label for="team2">Team 2:</label><br>
        <input type="text" id="team2" name="team2" value=""><br>
        <label for="date">Date:</label><br>
        <input type="date" id="date" name="date" value=""><br>
        <label for="time">Time:</label><br>
        <input type="time" id="time" name="time" value=""><br>
        <label for="location">Location:</label><br>
        <input type="text" id="location" name="location" value=""><br>
        <label for="submitterEmail">Submitter Email:</label><br>
        <input type="email" id="submitterEmail" name="submitterEmail" value=""><br>
        <label for="description">Description:</label><br>
        <input type="text" id="description" name="description" value=""><br>
        <label for="sportType">Sport Type:</label><br>
        <select name="sportType" id="sportType">
            <option value="">Select Sport</option>
            <option value="soccer">Soccer</option>
            <option value="basketball">Basketball</option>
            <option value="tennis">Tennis</option>
            <option value="pickleball">Pickleball</option>
        </select>
        <label for="termsAccepted">Terms Accepted:</label><br>
        <input type="checkbox" id="termsAccepted" name="termsAccepted" value=""><br>
        <input type="submit" value="Submit">
    </form>

</body>

</html>
