<!DOCTYPE html>
<html>

<head>
    <title>HW1-Ananya Yallapragada</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #badde9;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        form {
            background-color: rgb(255, 255, 255);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        label {
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"],
        input[type="time"],
        select,
        textarea {
            width: 100%;
            padding: 8px;
            margin: 5px 0 15px;
            box-sizing: border-box;
        }

        fieldset {
            margin-bottom: 15px;
        }

        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Community sports league fixtures</h1>
    <center>
        <form id="fixtureForm">
            <label for="fixtureName">Fixture Name:</label><br>
            <input type="text" id="fixtureName" name="fixtureName" value=""
                placeholder="e.g., Round 1, Semifinal, or Final" required size="30" autofocus><br>
            <fieldset> <!-- grouping related elements -->
                <legend>Teams</legend>
                <label for="team1">Team 1:</label><br>
                <input type="text" id="team1" name="team1" placeholder="Enter the first team name" required
                    size="30"><br>
                <label for="team2">Team 2:</label><br>
                <input type="text" id="team2" name="team2" placeholder="Enter the second team name" required
                    size="30"><br>
            </fieldset>
            <label for="date">Date:</label><br>
            <input type="date" id="date" name="date" value="" required><br>
            <label for="time">Time:</label><br>
            <input type="time" id="time" name="time" value="" required><br>
            <label for="location">Location:</label><br>
            <input type="text" id="location" name="location" value="" placeholder="eg. Spartan Stadium" required
                size="30"><br>
            <label for="submitterEmail">Submitter Email:</label><br>
            <input type="email" id="submitterEmail" name="submitterEmail" value=""
                placeholder="e.g. leaguemanager@email.com" required size="30"><br>
            <label for="description">Description:</label><br>
            <textarea id="description" name="description" rows="5" cols="50"
                placeholder="Enter additional fixture details, such as arrival instructions, match rules, or schedule notes"
                required></textarea><br>
            <label for="sportType">Sport Type:</label><br>
            <select name="sportType" id="sportType">
                <option value="">Select Sport</option>
                <option value="soccer">Soccer</option>
                <option value="basketball">Basketball</option>
                <option value="tennis">Tennis</option>
                <option value="pickleball">Pickleball</option>
            </select><br>
            <input type="checkbox" id="termsAccepted" name="termsAccepted" value="">
            <label for="termsAccepted">I agree to the terms and conditions.</label><br>
            <input type="submit" value="Create Fixture">
        </form>
    </center>
    <script src="script.js"></script>
</body>

</html>
